server {
    # Port 3000 is kept so the compose port mapping and the E2E BASE_URL
    # stay the same as when the app was served by `serve`.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches what `serve` sent: a charset on HTML and JavaScript, none on
    # SVG. nginx's default charset_types already covers exactly those, so no
    # override is needed. index.html declares UTF-8 itself; this is parity,
    # not a fix.
    charset utf-8;

    # Single-page app: React Router owns the paths, so any request that is
    # not a real file is answered with index.html. Without this, loading
    # /login or /register directly would return 404. `serve -s` did the same.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
